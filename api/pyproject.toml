[project]
name = "sih26182-api"
version = "0.1.0"
description = "SIH26182 – VASP Wallet Attribution API (FastAPI service)."
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "MEDUSA Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "SQLAlchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "typer>=0.12.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-redis>=4.6.0",
    "faker>=30.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "SIM", "PL"]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "F403",
    "F405",
    "E402",
    "B008",
    "N811",
    "PLC0415",
    "PLR1714",
    "PLW0127",
    "PLW0603",
    "PLR0912", # too many branches (data loader is necessarily branchy)
]

[tool.ruff.lint.per-file-ignores]
"app/alembic/env.py" = ["E402"]
"tests/*" = ["PLR2004", "F401"]
"app/main.py" = ["PLC0415"]
"app/providers/demo.py" = ["PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
exclude = ["build", "dist", "alembic/versions"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true