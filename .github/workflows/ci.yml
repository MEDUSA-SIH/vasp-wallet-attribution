name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install "ruff>=0.6.0"

      - name: Ruff check
        run: ruff check api/ packages/

      - name: Ruff format check
        run: ruff format --check api/ packages/

  import-check:
    name: Import smoke (app can boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install api package + dev extras
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke
        working-directory: api
        run: |
          python -c "from app.main import create_app; print('app created OK')"
          python -c "from app.providers import DemoBlockchainProvider; print('demo provider OK')"
          python -c "from app.attribution.engine import AttributionEngine; print('attribution engine OK')"
          python -c "from app.graph.store import GraphStore; print('graph store OK')"
          python -c "from app.sahyog.gateway import SahyogGateway; print('sahyog gateway OK')"

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sih26182
          POSTGRES_PASSWORD: sih26182
          POSTGRES_DB: sih26182_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
        DATABASE_URL: postgresql+asyncpg://sih26182:sih26182@localhost:5432/sih26182_test
        POSTGRES_HOST: localhost
        POSTGRES_PORT: "5432"
        POSTGRES_USER: sih26182
        POSTGRES_PASSWORD: sih26182
        POSTGRES_DB: sih26182_test
        REDIS_HOST: localhost
        REDIS_PORT: "6379"
        DEMO_MODE: "true"
        SECRET_KEY: ci-test-secret
        API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install api package + dev extras
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install psycopg2-binary

      - name: Run pytest
        working-directory: api
        run: pytest -v