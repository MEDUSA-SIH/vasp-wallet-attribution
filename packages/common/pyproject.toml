[project]
name = "sih26182-common"
version = "0.1.0"
description = "Shared Python types for the SIH26182 monorepo."
requires-python = ">=3.12"
license = { text = "Proprietary" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.ruff]
line-length = 100
target-version = "py312"